<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk — perpusta-vibe</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/" style="text-decoration:none">perpusta<span>-vibe</span></a>
  </div>
</header>
<main id="app">
  <div class="box login">
    <h2>Masuk</h2>
    <div class="row">
      <input id="email" type="email" placeholder="Email" style="flex:1;min-width:200px">
    </div>
    <div class="row">
      <input id="password" type="password" placeholder="Password" style="flex:1;min-width:200px">
    </div>
    <div class="row">
      <input id="name" placeholder="Nama (untuk daftar akun baru)" style="flex:1;min-width:200px">
      <select id="level">
        <option value="">Jenjang (opsional)</option>
        <option>SD/MI</option>
        <option>SMP/MTS</option>
        <option>SMA/MA/SMK/MAK</option>
      </select>
    </div>
    <div class="row">
      <button class="btn" id="btnLogin" onclick="doLogin()">Masuk</button>
      <button id="btnRegister" onclick="doRegister()">Daftar</button>
      <span class="muted" id="msg"></span>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
<script src="js/api-client.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
