<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk — Perpustakaan Digital</title>
<style>
  :root{--bg:#fff;--fg:#111;--line:#e5e5e5;--accent:#1a4d8f;--muted:#8a8a8a;--card:#f6f6f6;color-scheme:light;}
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 20px;z-index:5;padding-top:calc(16px + env(safe-area-inset-top,0px));}
  header h1{margin:0 0 12px;font-size:17px;font-weight:600}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{padding:6px 12px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;border-radius:4px}
  nav button.active{color:var(--fg);font-weight:600}
  main{padding:20px;max-width:1000px;margin:0 auto}
  h2{font-size:15px;font-weight:600;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:20px}
  .card{cursor:pointer;font-size:12px}
  .card img{width:100%;height:150px;object-fit:cover;background:var(--card);border-radius:4px}
  .card b{display:block;margin-top:8px;font-size:12px;font-weight:500;line-height:1.3em;max-height:3.9em;overflow:hidden}
  .muted{color:var(--muted);font-size:11px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.03em}
  input,select,textarea,button{font-size:13px;padding:7px 10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px}
  textarea{width:100%}
  .btn{background:var(--fg);color:#fff;border:none;padding:8px 14px;cursor:pointer;border-radius:4px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .badge{display:inline-block;background:var(--card);color:var(--fg);padding:3px 8px;border-radius:10px;font-size:11px;margin:2px}
  .box{border:1px solid var(--line);padding:14px;border-radius:6px;margin-bottom:12px}
  a{color:var(--accent)}
  iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>📚 Perpustakaan Digital</h1>
</header>
<main id="app">
  <div class="box">
    <h2>Masuk</h2>
    <div class="row">
      <input id="email" type="email" placeholder="Email" style="flex:1;min-width:200px">
    </div>
    <div class="row">
      <input id="password" type="password" placeholder="Password" style="flex:1;min-width:200px">
    </div>
    <div class="row">
      <input id="name" placeholder="Nama (untuk daftar akun baru)" style="flex:1;min-width:200px">
      <select id="level">
        <option value="">Jenjang (opsional)</option>
        <option>SD/MI</option>
        <option>SMP/MTS</option>
        <option>SMA/MA/SMK/MAK</option>
      </select>
    </div>
    <div class="row">
      <button class="btn" id="btnLogin" onclick="doLogin()">Masuk</button>
      <button id="btnRegister" onclick="doRegister()">Daftar</button>
      <span class="muted" id="msg"></span>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
<script src="js/api-client.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
